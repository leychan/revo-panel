name: Linux 打包与发布

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev libdbus-1-dev libfuse2t64 librsvg2-dev \
            libwebkit2gtk-4.1-dev libxdo-dev patchelf xdg-utils

      - name: 安装 pnpm 和前端依赖
        run: |
          npm install --global pnpm@11.28.4
          pnpm install --frozen-lockfile

      - name: 构建安装包
        env:
          # linuxdeploy 自带的 strip 无法处理部分 Ubuntu 系统库。
          NO_STRIP: 'true'
        run: |
          rustup default stable
          config=()
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            # 标签版本同时用于安装包文件名和应用版本。
            config=(--config "$(jq -cn --arg version "${GITHUB_REF_NAME#v}" '{version: $version}')")
          fi
          pnpm tauri build --bundles deb,appimage "${config[@]}" -- --locked

      - name: 生成 Arch Linux 安装包
        run: |
          bundle=src-tauri/target/release/bundle
          debs=("$bundle"/deb/*.deb)
          if (( ${#debs[@]} != 1 )) || [[ ! -f "${debs[0]}" ]]; then
            echo '::error::生成 Arch 安装包需要一个 amd64 .deb 成品'
            exit 1
          fi
          bash packaging/aur/prepare.sh "${debs[0]}" arch-package "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          # 只重打包现有文件，运行时依赖由 pacman 在安装时处理。
          docker run --rm --user "$(id -u):$(id -g)" -e PKGEXT=.pkg.tar.zst \
            -v "$PWD/arch-package:/pkg" -w /pkg archlinux:base-devel \
            makepkg --nodeps --nosign --clean
          mkdir -p "$bundle/arch"
          mv arch-package/*.pkg.tar.zst "$bundle/arch/"

      - name: 保存安装包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: revo-panel-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/arch/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  release:
    name: 发布 GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - name: 下载安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: revo-panel-linux-x86_64
          path: packages

      - name: 发布并附上安装包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          debs=(packages/deb/*.deb)
          appimages=(packages/appimage/*.AppImage)
          arch_packages=(packages/arch/*.pkg.tar.zst)
          test -f "${debs[0]}" && test -f "${appimages[0]}" && test -f "${arch_packages[0]}" || {
            echo '::error::缺少 .deb、.AppImage 或 .pkg.tar.zst 安装包'
            exit 1
          }
          if ! gh release view "$tag" >/dev/null 2>&1; then
            options=()
            version="${tag#v}"
            if [[ "${version%%+*}" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$tag" --verify-tag --draft --title "$tag" --generate-notes "${options[@]}"
          fi

          # 重跑时补上传缺失的成品，已有附件保留。
          release=$(gh release view "$tag" --json assets,isDraft)
          existing=$(jq -r '.assets[].name' <<<"$release")
          for package in "${debs[@]}" "${appimages[@]}" "${arch_packages[@]}"; do
            if ! grep -Fxq -- "${package##*/}" <<<"$existing"; then
              gh release upload "$tag" "$package"
            fi
          done
          if jq -e '.isDraft' <<<"$release" >/dev/null; then
            gh release edit "$tag" --draft=false
          fi

  aur:
    name: 发布 AUR
    if: github.event.repository.private == false
    needs: release
    runs-on: ubuntu-24.04
    concurrency:
      group: aur-revo-panel-bin
    steps:
      - name: 检查 AUR 发布条件
        id: aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'AUR 只发布稳定版本，且需要配置 AUR_SSH_PRIVATE_KEY'
          fi

      - name: 检出版本源码
        if: steps.aur.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 生成 PKGBUILD 和 .SRCINFO
        if: steps.aur.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 从已发布的 Release 下载成品，AUR 校验的就是用户会下载的文件。
          deb="RevoPanel_${version}_amd64.deb"
          gh release download "$GITHUB_REF_NAME" --pattern "$deb" --dir release-assets
          if [[ $(dpkg-deb -f "release-assets/$deb" Version) != "$version" ]]; then
            echo '::error::Release 中的 .deb 版本与标签不一致'
            exit 1
          fi
          project_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          bash packaging/aur/prepare.sh "release-assets/$deb" aur-package "$project_url" \
            "$project_url/releases/download/$GITHUB_REF_NAME/$deb"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/aur-package:/pkg:ro" -w /pkg archlinux:base-devel \
            makepkg --printsrcinfo > aur-package/.SRCINFO

      - name: 推送 AUR 更新
        if: steps.aur.outputs.enabled == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          (umask 077; printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key")
          unset AUR_SSH_PRIVATE_KEY

          # 发布前比对 AUR 官网公布的 Ed25519 主机指纹。
          ssh-keyscan -T 15 -t ed25519 aur.archlinux.org > "$ssh_dir/known_hosts"
          fingerprint=$(ssh-keygen -lf "$ssh_dir/known_hosts" | awk '{print $2}' | sort -u)
          if [[ "$fingerprint" != 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' ]]; then
            echo '::error::AUR 的 SSH 主机指纹与官网记录不符'
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"

          git -c init.defaultBranch=master clone ssh://aur@aur.archlinux.org/revo-panel-bin.git aur-repo
          version="${GITHUB_REF_NAME#v}"
          if [[ -f aur-repo/.SRCINFO ]]; then
            existing=$(awk '$1 == "pkgver" {print $3; exit}' aur-repo/.SRCINFO)
            if [[ $(printf '%s\n' "$existing" "$version" | sort -V | tail -n 1) != "$version" ]]; then
              echo 'AUR 已发布更新的版本'
              exit 0
            fi
          fi
          cp aur-package/{PKGBUILD,.SRCINFO,LICENSE} aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO LICENSE
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='RevoPanel Release' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "更新 RevoPanel 至 $version"
          git push origin HEAD:master
